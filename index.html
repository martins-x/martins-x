<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRT Finanças</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
body{background:#07090d;color:#fff;font-family:Arial;margin:0;padding:0;max-width:480px;margin:auto}
.card{background:#111;padding:15px;border-radius:12px;margin:10px}
input,button{padding:10px;border-radius:8px;border:none;width:100%;margin-top:5px}
button{background:#00d97e;color:#000;font-weight:bold}
.item{background:#1a1a1a;padding:10px;margin:10px;border-radius:10px;display:flex;justify-content:space-between}
</style>
</head>

<body>

<div class="card">
<h2>MRT Finanças</h2>
<input id="gasto" placeholder="mercado 50">
<button onclick="addGasto()">Adicionar gasto</button>
</div>

<div class="card">
<input id="divida" placeholder="cartão 100 5x">
<button onclick="addDivida()">Adicionar dívida</button>
</div>

<div class="card">
<h3 id="saldo"></h3>
<p>Gastos: <span id="tg"></span></p>
<p>Dívidas: <span id="td"></span></p>
</div>

<div id="lista"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
import { enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBg5q1i6ZprD4w_bJwLSDlLitaWSnsd-6Q",
  authDomain: "mrt-financas.firebaseapp.com",
  projectId: "mrt-financas",
  storageBucket: "mrt-financas.firebasestorage.app",
  messagingSenderId: "499178108015",
  appId: "1:499178108015:web:ffb61fd1e64bf8787f099a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

enableIndexedDbPersistence(db);

const uid = localStorage.getItem("uid") || crypto.randomUUID();
localStorage.setItem("uid", uid);

const gastosRef = collection(db, "users", uid, "gastos");
const dividasRef = collection(db, "users", uid, "dividas");

let gastos = [];
let dividas = [];

function parseValor(txt){
  return parseFloat(txt.replace(",", ".").match(/\d+(\.\d+)?/)?.[0]) || 0;
}

onSnapshot(gastosRef, snap=>{
  gastos = snap.docs.map(d=>d.data());
  render();
});

onSnapshot(dividasRef, snap=>{
  dividas = snap.docs.map(d=>d.data());
  render();
});

window.addGasto = async ()=>{
  let txt = document.getElementById("gasto").value;
  if(!txt) return;

  await addDoc(gastosRef,{
    nome: txt,
    valor: parseValor(txt)
  });

  document.getElementById("gasto").value="";
};

window.addDivida = async ()=>{
  let txt = document.getElementById("divida").value;
  if(!txt) return;

  let valor = parseValor(txt);
  let parcelas = parseInt(txt.match(/\d+(?=x)/)?.[0]) || 1;

  await addDoc(dividasRef,{
    nome: txt,
    valor,
    parcelas,
    restantes: parcelas
  });

  document.getElementById("divida").value="";
};

function render(){
  let tg=0, td=0;
  const lista = document.getElementById("lista");
  lista.innerHTML="";

  gastos.forEach(g=>{
    tg+=g.valor;
    lista.innerHTML+=`<div class="item">${g.nome} R$${g.valor.toFixed(2)}</div>`;
  });

  dividas.forEach(d=>{
    td += d.valor * (d.restantes || 1);
    lista.innerHTML+=`<div class="item">${d.nome} (${d.restantes}x)</div>`;
  });

  document.getElementById("saldo").innerText="Saldo: R$ "+(-tg-td).toFixed(2);
  document.getElementById("tg").innerText=tg.toFixed(2);
  document.getElementById("td").innerText=td.toFixed(2);
}
</script>

</body>
</html>
