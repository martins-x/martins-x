<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MRT Finanças</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #07090d;
  --s1: #0d1117;
  --s2: #131920;
  --border: #1e2a38;
  --green: #00d97e;
  --red: #ff4d6d;
  --yellow: #ffd166;
  --blue: #4d9fff;
  --purple: #b47cff;
  --text: #e0eaf8;
  --muted: #4a5e72;
  --muted2: #2a3a4a;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Outfit', sans-serif;
  min-height: 100vh; max-width: 480px; margin: 0 auto; padding-bottom: 80px;
}

.nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  background: var(--s1); border-top: 1px solid var(--border);
  display: flex; z-index: 100; padding: 6px 0 10px;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; color: var(--muted);
  font-family: 'Outfit', sans-serif; font-size: 0.55rem; font-weight: 600;
  letter-spacing: 0.5px; cursor: pointer; padding: 4px 0; transition: color 0.2s;
}
.nav-btn .icon { font-size: 1.1rem; }
.nav-btn.active { color: var(--green); }

.page { display: none; padding: 0 0 16px; }
.page.active { display: block; }

.page-header { padding: 20px 20px 0; margin-bottom: 16px; }
.page-title { font-size: 1.3rem; font-weight: 800; }
.page-sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

.card { background: var(--s1); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin: 0 16px 10px; }
.card-label { font-size: 0.62rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.card-value { font-family: 'JetBrains Mono', monospace; font-size: 1.7rem; font-weight: 500; line-height: 1.1; }
.card-value.green { color: var(--green); }
.card-value.red { color: var(--red); }
.card-value.yellow { color: var(--yellow); }
.card-value.purple { color: var(--purple); }
.card-sub { font-size: 0.72rem; color: var(--muted); margin-top: 5px; }

.cards-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 16px 10px; }
.cards-row .card { margin: 0; }
.cards-row .card .card-value { font-size: 1.1rem; }

.cards-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 0 16px 10px; }
.cards-3 .card { margin: 0; padding: 12px; }
.cards-3 .card .card-value { font-size: 0.95rem; }
.cards-3 .card .card-label { font-size: 0.55rem; }

.saldo-bar { background: var(--s2); border-radius: 8px; height: 6px; margin-top: 10px; overflow: hidden; }
.saldo-fill { height: 100%; border-radius: 8px; background: var(--green); transition: width 0.6s ease; }
.saldo-fill.danger { background: var(--red); }

.section-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
.section-title { font-size: 0.62rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.section-right { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--yellow); }

.item {
  background: var(--s1); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 13px; margin: 0 16px 7px;
  display: flex; align-items: center; gap: 11px;
  transition: all 0.2s; animation: slideIn 0.25s ease;
}
@keyframes slideIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
.item.pago { opacity: 0.35; }
.item.pago .item-name { text-decoration: line-through; }
.item.vencendo { border-color: var(--yellow)50; background: #1a150033; }

.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.green { background: var(--green); }
.dot.red { background: var(--red); }
.dot.yellow { background: var(--yellow); }
.dot.blue { background: var(--blue); }
.dot.purple { background: var(--purple); }

.item-info { flex: 1; min-width: 0; }
.item-name { font-size: 0.86rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-meta { font-size: 0.68rem; color: var(--muted); margin-top: 2px; font-family: 'JetBrains Mono', monospace; }

.item-vals { text-align: right; flex-shrink: 0; }
.item-val { font-family: 'JetBrains Mono', monospace; font-size: 0.86rem; font-weight: 500; }
.item-val-sub { font-size: 0.63rem; color: var(--muted); margin-top: 1px; }

.item-actions { display: flex; flex-direction: column; gap: 5px; }
.icon-btn {
  width: 27px; height: 27px; border-radius: 7px; border: 1px solid var(--border);
  background: none; cursor: pointer; font-size: 0.78rem;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); transition: all 0.15s;
}
.icon-btn.pay { color: var(--green); border-color: var(--green)40; }
.icon-btn.del { color: var(--red); border-color: var(--red)40; }

/* GASTO RÁPIDO */
.gasto-rapido {
  background: var(--s1); border: 1px solid var(--border); border-radius: 16px;
  padding: 16px; margin: 0 16px 10px;
}
.categorias { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
.cat-btn {
  padding: 7px 12px; border-radius: 99px; border: 1.5px solid var(--border);
  background: none; color: var(--muted); font-family: 'Outfit', sans-serif;
  font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.cat-btn.selected { border-color: var(--purple); color: var(--purple); background: var(--purple)15; }

.gasto-input-row { display: flex; gap: 8px; align-items: center; }
.gasto-input-row input { flex: 1; }
.btn-gasto {
  padding: 10px 16px; border-radius: 10px; border: none;
  background: var(--purple); color: #fff;
  font-family: 'Outfit', sans-serif; font-size: 0.88rem; font-weight: 700;
  cursor: pointer; white-space: nowrap; transition: all 0.2s;
}
.btn-gasto:hover { opacity: 0.88; }

.form-card { background: var(--s1); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin: 0 16px 10px; }
.form-title { font-size: 0.62rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 9px; }
.form-full { grid-column: 1 / -1; }

label { font-size: 0.7rem; color: var(--muted); display: block; margin-bottom: 3px; }
input, select {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 9px; color: var(--text); font-family: 'Outfit', sans-serif;
  font-size: 0.86rem; padding: 10px 12px; outline: none; transition: border-color 0.2s;
}
input:focus, select:focus { border-color: var(--green); }
input::placeholder { color: var(--muted2); }
select option { background: var(--s2); }

.btn { width: 100%; padding: 12px; border-radius: 11px; border: none; font-family: 'Outfit', sans-serif; font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
.btn-green { background: var(--green); color: #000; }
.btn-blue { background: var(--blue); color: #000; }
.btn-ghost { background: var(--s2); color: var(--muted); border: 1px solid var(--border); margin-top: 7px; }

.hist-item { display: flex; align-items: center; gap: 11px; padding: 11px 16px; border-bottom: 1px solid var(--border); }
.hist-icon { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; flex-shrink: 0; background: var(--s2); }
.hist-info { flex: 1; min-width: 0; }
.hist-nome { font-size: 0.83rem; font-weight: 500; }
.hist-data { font-size: 0.68rem; color: var(--muted); margin-top: 1px; }
.hist-val { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; font-weight: 500; }

.chart-wrap { margin: 0 16px 10px; background: var(--s1); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
.chart-wrap canvas { max-height: 180px; }

.empty { text-align: center; padding: 36px 20px; color: var(--muted); }
.empty-icon { font-size: 2.2rem; margin-bottom: 8px; }
.empty p { font-size: 0.8rem; line-height: 1.6; }

.mes-badge {
  background: var(--purple)20; color: var(--purple); border: 1px solid var(--purple)40;
  font-size: 0.65rem; font-weight: 700; padding: 3px 10px; border-radius: 99px;
  letter-spacing: 0.5px; text-transform: uppercase;
}

.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; margin-left: 6px; transition: background 0.3s; }
.sync-dot.ok { background: var(--green); }
.sync-dot.loading { background: var(--yellow); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }

.notif {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: var(--s2); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 16px; font-size: 0.8rem; z-index: 200;
  white-space: nowrap; box-shadow: 0 8px 32px #00000080;
  display: none; animation: slideIn 0.3s ease;
}

.loading-screen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 999; gap: 14px;
}
.loading-screen .logo { font-size: 1.7rem; font-weight: 800; color: var(--green); }
.loading-screen p { font-size: 0.8rem; color: var(--muted); }
.spinner { width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="loading-screen" id="loading">
  <div class="logo">MRT 💰</div>
  <div class="spinner"></div>
  <p>Conectando...</p>
</div>

<!-- HOME -->
<div class="page active" id="page-home">
  <div class="page-header">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div>
        <div class="page-title">MRT Finanças <span class="sync-dot" id="sync-dot"></span></div>
        <div class="page-sub" id="data-hoje"></div>
      </div>
      <span class="mes-badge" id="mes-badge">—</span>
    </div>
  </div>

  <div class="card" style="background:linear-gradient(135deg,#0a1f14,#0d1117);border-color:#00d97e25">
    <div class="card-label">Saldo disponível</div>
    <div class="card-value green" id="h-saldo">R$ 0,00</div>
    <div class="saldo-bar"><div class="saldo-fill" id="h-bar" style="width:0%"></div></div>
    <div class="card-sub" id="h-sub">Conectando...</div>
  </div>

  <div class="cards-3">
    <div class="card">
      <div class="card-label">Receitas</div>
      <div class="card-value green" id="h-rec">R$ 0</div>
    </div>
    <div class="card">
      <div class="card-label">Dívidas</div>
      <div class="card-value red" id="h-div">R$ 0</div>
    </div>
    <div class="card">
      <div class="card-label">Gastos</div>
      <div class="card-value purple" id="h-gas">R$ 0</div>
    </div>
  </div>

  <div class="chart-wrap">
    <div class="card-label" style="margin-bottom:10px">Visão do mês</div>
    <canvas id="chart-home"></canvas>
  </div>

  <div class="section-header">
    <div class="section-title">⚠ Vencendo em breve</div>
  </div>
  <div id="home-alertas"></div>
</div>

<!-- GASTOS -->
<div class="page" id="page-gastos">
  <div class="page-header">
    <div class="page-title">Gastos do Mês</div>
    <div class="page-sub" id="gas-sub"></div>
  </div>

  <div class="gasto-rapido">
    <div class="form-title">+ Anotar gasto</div>
    <div class="categorias" id="categorias-btns"></div>
    <div style="margin-bottom:8px">
      <label>Descrição (opcional)</label>
      <input type="text" id="g-desc" placeholder="ex: Compras da semana">
    </div>
    <div class="gasto-input-row">
      <input type="number" id="g-valor" placeholder="R$ 0,00" step="0.01">
      <button class="btn-gasto" onclick="adicionarGasto()">+ Anotar</button>
    </div>
  </div>

  <div class="section-header">
    <div class="section-title">Gastos registrados</div>
    <div class="section-right" id="gas-total"></div>
  </div>
  <div id="gastos-lista"></div>

  <div style="padding:0 16px;margin-top:4px">
    <button class="btn btn-ghost" onclick="limparGastosMes()">🗑 Limpar gastos do mês</button>
  </div>
</div>

<!-- DÍVIDAS -->
<div class="page" id="page-dividas">
  <div class="page-header">
    <div class="page-title">Dívidas</div>
    <div class="page-sub" id="div-sub"></div>
  </div>
  <div id="dividas-lista"></div>
  <div class="form-card">
    <div class="form-title">+ Nova dívida</div>
    <div class="form-grid">
      <div class="form-full"><label>Nome</label><input type="text" id="d-nome" placeholder="ex: Netflix"></div>
      <div><label>Valor (R$)</label><input type="number" id="d-valor" placeholder="0,00" step="0.01"></div>
      <div><label>Parcelas</label><input type="number" id="d-parcelas" placeholder="1" min="1" value="1"></div>
      <div><label>Vence dia</label><input type="number" id="d-dia" placeholder="ex: 5" min="1" max="31"></div>
      <div><label>Grupo</label>
        <select id="d-grupo">
          <option>Cartão Sicredi</option><option>Carteira</option><option>Gang</option><option>Outros</option>
        </select>
      </div>
    </div>
    <button class="btn btn-green" onclick="adicionarDivida()">Adicionar dívida</button>
  </div>
</div>

<!-- RECEITAS -->
<div class="page" id="page-receitas">
  <div class="page-header">
    <div class="page-title">Receitas</div>
    <div class="page-sub" id="rec-sub"></div>
  </div>
  <div id="receitas-lista"></div>
  <div class="form-card">
    <div class="form-title">+ Nova receita</div>
    <div class="form-grid">
      <div class="form-full"><label>Descrição</label><input type="text" id="r-nome" placeholder="ex: Salário, Freela..."></div>
      <div><label>Valor (R$)</label><input type="number" id="r-valor" placeholder="0,00" step="0.01"></div>
      <div><label>Dia de entrada</label><input type="number" id="r-dia" placeholder="ex: 5" min="1" max="31"></div>
      <div class="form-full"><label>Tipo</label>
        <select id="r-tipo"><option>Fixo mensal</option><option>Eventual</option></select>
      </div>
    </div>
    <button class="btn btn-blue" onclick="adicionarReceita()">Adicionar receita</button>
  </div>
</div>

<!-- HISTÓRICO -->
<div class="page" id="page-hist">
  <div class="page-header">
    <div class="page-title">Histórico</div>
    <div class="page-sub">Todas as ações registradas</div>
  </div>
  <div id="hist-lista"></div>
  <div style="padding:0 16px;margin-top:8px">
    <button class="btn btn-ghost" onclick="limparHist()">🗑 Limpar histórico</button>
  </div>
</div>

<div class="notif" id="notif"></div>

<nav class="nav">
  <button class="nav-btn active" onclick="irPara('home',this)"><span class="icon">🏠</span>Resumo</button>
  <button class="nav-btn" onclick="irPara('gastos',this)"><span class="icon">🛒</span>Gastos</button>
  <button class="nav-btn" onclick="irPara('dividas',this)"><span class="icon">💳</span>Dívidas</button>
  <button class="nav-btn" onclick="irPara('receitas',this)"><span class="icon">💵</span>Receitas</button>
  <button class="nav-btn" onclick="irPara('hist',this)"><span class="icon">📋</span>Histórico</button>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBg5q1i6ZprD4w_bJwLSDlLitaWSnsd-6Q",
  authDomain: "mrt-financas.firebaseapp.com",
  projectId: "mrt-financas",
  storageBucket: "mrt-financas.firebasestorage.app",
  messagingSenderId: "499178108015",
  appId: "1:499178108015:web:ffb61fd1e64bf8787f099a"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const REF = doc(db, "dados", "principal");

// ── CATEGORIAS DE GASTO ───────────────────────────────────────────────────────
const CATEGORIAS = [
  { id:'mercado',   emoji:'🛒', label:'Mercado' },
  { id:'posto',     emoji:'⛽', label:'Posto' },
  { id:'farmacia',  emoji:'💊', label:'Farmácia' },
  { id:'restaurante',emoji:'🍔',label:'Comida' },
  { id:'transporte',emoji:'🚌', label:'Transporte' },
  { id:'lazer',     emoji:'🎮', label:'Lazer' },
  { id:'saude',     emoji:'🏥', label:'Saúde' },
  { id:'outro',     emoji:'📦', label:'Outro' },
];

let catSelecionada = 'mercado';

// ── DADOS INICIAIS ────────────────────────────────────────────────────────────
const mesAtual = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };

const INICIAIS = {
  dividas: [
    { id:1,  nome:"Discord",            valor:24.99,  parcelas:1, restantes:1, dia:null, grupo:"Cartão Sicredi", pago:false },
    { id:2,  nome:"Apple",              valor:5.90,   parcelas:1, restantes:1, dia:null, grupo:"Cartão Sicredi", pago:false },
    { id:3,  nome:"Spotify",            valor:34.99,  parcelas:1, restantes:1, dia:null, grupo:"Cartão Sicredi", pago:false },
    { id:4,  nome:"Vivo",               valor:37.50,  parcelas:1, restantes:1, dia:null, grupo:"Cartão Sicredi", pago:false },
    { id:5,  nome:"Academia",           valor:57.00,  parcelas:1, restantes:1, dia:null, grupo:"Cartão Sicredi", pago:false },
    { id:6,  nome:"Curso",              valor:31.11,  parcelas:1, restantes:1, dia:null, grupo:"Cartão Sicredi", pago:false },
    { id:7,  nome:"Shopee",             valor:77.04,  parcelas:5, restantes:5, dia:null, grupo:"Cartão Sicredi", pago:false },
    { id:8,  nome:"Honda",              valor:60.00,  parcelas:3, restantes:3, dia:null, grupo:"Cartão Sicredi", pago:false },
    { id:9,  nome:"Tio Ângelo",         valor:460.85, parcelas:3, restantes:3, dia:null, grupo:"Carteira",       pago:false },
    { id:10, nome:"Cartão Caixa",       valor:179.21, parcelas:5, restantes:5, dia:null, grupo:"Carteira",       pago:false },
    { id:11, nome:"Gang",               valor:85.47,  parcelas:3, restantes:3, dia:null, grupo:"Gang",           pago:false },
    { id:12, nome:"Associação Sicredi", valor:20.00,  parcelas:1, restantes:1, dia:5,    grupo:"Outros",         pago:false },
  ],
  receitas: [],
  gastos: [],
  historico: [],
  mesFechado: '',
  nid: 13
};

// ── ESTADO ────────────────────────────────────────────────────────────────────
let estado = null;

async function salvar() {
  setSyncDot('loading');
  await setDoc(REF, estado);
  setSyncDot('ok');
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
const fmt = v => 'R$ ' + v.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const fmtCurto = v => { if(v>=1000) return 'R$'+v.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); return 'R$'+v.toFixed(0); };
const diaHoje = () => new Date().getDate();
const fmtDt = d => new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const corGrupo = g => ({Carteira:'red',Gang:'yellow',Outros:'blue'})[g]||'green';
const vencendo = dia => dia && dia >= diaHoje() && dia <= diaHoje()+5;
const setSyncDot = s => { const d=document.getElementById('sync-dot'); d.className='sync-dot '+s; };
const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function regHist(tipo, nome, valor) {
  estado.historico.unshift({tipo,nome,valor,data:new Date().toISOString()});
  if(estado.historico.length>150) estado.historico=estado.historico.slice(0,150);
}

// ── RESET MENSAL (dia 1) ──────────────────────────────────────────────────────
function verificarResetMensal() {
  const mes = mesAtual();
  if(estado.mesFechado !== mes && diaHoje() === 1) {
    // Reseta contas pagas para pendente (exceto quitadas)
    estado.dividas.forEach(d => {
      if(d.pago && d.restantes === 0) return; // quitada, não ressurge
      d.pago = false;
    });
    // Limpa gastos do mês anterior
    estado.gastos = [];
    estado.mesFechado = mes;
    regHist('reset', 'Reset mensal', 0);
  }
}

// ── NAVEGAÇÃO ─────────────────────────────────────────────────────────────────
window.irPara = function(pg, btn) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+pg).classList.add('active');
  if(btn) btn.classList.add('active');
  renderizar();
};

// ── GASTOS ────────────────────────────────────────────────────────────────────
function renderCategorias() {
  document.getElementById('categorias-btns').innerHTML = CATEGORIAS.map(c =>
    `<button class="cat-btn ${catSelecionada===c.id?'selected':''}" onclick="selecionarCat('${c.id}')">${c.emoji} ${c.label}</button>`
  ).join('');
}

window.selecionarCat = function(id) {
  catSelecionada = id;
  renderCategorias();
};

window.adicionarGasto = async function() {
  const valor = parseFloat(document.getElementById('g-valor').value);
  const desc  = document.getElementById('g-desc').value.trim();
  if(isNaN(valor)||valor<=0){notif('⚠️ Digite o valor!');return;}
  const cat = CATEGORIAS.find(c=>c.id===catSelecionada);
  const nome = desc || cat.label;
  estado.gastos.push({
    id: estado.nid++,
    nome,
    categoria: catSelecionada,
    emoji: cat.emoji,
    valor,
    data: new Date().toISOString()
  });
  regHist('gasto', `${cat.emoji} ${nome}`, valor);
  await salvar(); renderizar();
  document.getElementById('g-valor').value='';
  document.getElementById('g-desc').value='';
  notif(`${cat.emoji} R$ ${valor.toFixed(2).replace('.',',')} anotado!`);
};

window.removerGasto = async function(id) {
  estado.gastos = estado.gastos.filter(g=>g.id!==id);
  await salvar(); renderizar(); notif('🗑 Removido');
};

window.limparGastosMes = async function() {
  estado.gastos = [];
  await salvar(); renderizar(); notif('🗑 Gastos do mês limpos');
};

// ── DÍVIDAS ───────────────────────────────────────────────────────────────────
window.adicionarDivida = async function() {
  const nome=document.getElementById('d-nome').value.trim();
  const valor=parseFloat(document.getElementById('d-valor').value);
  const parcelas=parseInt(document.getElementById('d-parcelas').value)||1;
  const dia=parseInt(document.getElementById('d-dia').value)||null;
  const grupo=document.getElementById('d-grupo').value;
  if(!nome||isNaN(valor)||valor<=0){notif('⚠️ Preencha nome e valor!');return;}
  estado.dividas.push({id:estado.nid++,nome,valor,parcelas,restantes:parcelas,dia,grupo,pago:false});
  regHist('adicionado',nome,valor);
  await salvar(); renderizar();
  ['d-nome','d-valor','d-dia'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('d-parcelas').value='1';
  notif('✅ Dívida adicionada!');
};

window.pagarParcela = async function(id) {
  const d=estado.dividas.find(d=>d.id===id);
  if(!d)return;
  if(d.restantes>1){d.restantes--;notif(`✅ Parcela paga! Restam ${d.restantes}x`);}
  else{d.restantes=0;d.pago=true;notif(`🎉 ${d.nome} quitado!`);}
  regHist('pago',d.nome,d.valor);
  await salvar(); renderizar();
};

window.removerDivida = async function(id) {
  const d=estado.dividas.find(d=>d.id===id);
  if(d)regHist('removido',d.nome,d.valor);
  estado.dividas=estado.dividas.filter(d=>d.id!==id);
  await salvar(); renderizar(); notif('🗑 Removido');
};

// ── RECEITAS ──────────────────────────────────────────────────────────────────
window.adicionarReceita = async function() {
  const nome=document.getElementById('r-nome').value.trim();
  const valor=parseFloat(document.getElementById('r-valor').value);
  const dia=parseInt(document.getElementById('r-dia').value)||null;
  const tipo=document.getElementById('r-tipo').value;
  if(!nome||isNaN(valor)||valor<=0){notif('⚠️ Preencha nome e valor!');return;}
  estado.receitas.push({id:estado.nid++,nome,valor,dia,tipo});
  regHist('receita',nome,valor);
  await salvar(); renderizar();
  ['r-nome','r-valor','r-dia'].forEach(id=>document.getElementById(id).value='');
  notif('✅ Receita adicionada!');
};

window.removerReceita = async function(id) {
  estado.receitas=estado.receitas.filter(r=>r.id!==id);
  await salvar(); renderizar(); notif('🗑 Removido');
};

window.limparHist = async function() {
  estado.historico=[];
  await salvar(); renderizar(); notif('🗑 Histórico limpo');
};

// ── RENDER ────────────────────────────────────────────────────────────────────
let chart=null;
function renderizar() {
  if(!estado) return;
  const {dividas,receitas,gastos,historico}=estado;

  const totDiv = dividas.filter(d=>!d.pago).reduce((s,d)=>s+d.valor,0);
  const totRec = receitas.reduce((s,r)=>s+r.valor,0);
  const totGas = gastos.reduce((s,g)=>s+g.valor,0);
  const saldo  = totRec - totDiv - totGas;
  const pct    = totRec>0?Math.min(Math.max((saldo/totRec)*100,0),100):0;
  const d      = new Date();

  // Mês badge
  document.getElementById('mes-badge').textContent = `${meses[d.getMonth()]} ${d.getFullYear()}`;

  // HOME
  const se=document.getElementById('h-saldo');
  se.textContent=fmt(saldo); se.className='card-value '+(saldo>=0?'green':'red');
  document.getElementById('h-rec').textContent=fmtCurto(totRec);
  document.getElementById('h-div').textContent=fmtCurto(totDiv);
  document.getElementById('h-gas').textContent=fmtCurto(totGas);
  document.getElementById('h-bar').style.width=pct+'%';
  document.getElementById('h-bar').className='saldo-fill'+(saldo<0?' danger':'');
  document.getElementById('h-sub').textContent=totRec>0
    ?`${pct.toFixed(0)}% da renda livre (receitas - dívidas - gastos)`
    :'Adicione suas receitas para ver o saldo';

  // Alertas
  const alertas=dividas.filter(d=>!d.pago&&vencendo(d.dia));
  document.getElementById('home-alertas').innerHTML=alertas.length
    ?alertas.map(d=>`<div class="item vencendo"><div class="dot yellow"></div><div class="item-info"><div class="item-name">${d.nome}</div><div class="item-meta">vence dia ${d.dia}</div></div><div class="item-vals"><div class="item-val" style="color:var(--yellow)">${fmt(d.valor)}</div></div></div>`).join('')
    :`<div class="empty"><div class="empty-icon">✅</div><p>Nenhuma conta vencendo em breve</p></div>`;

  // Chart
  const ctx=document.getElementById('chart-home').getContext('2d');
  if(chart)chart.destroy();
  chart=new Chart(ctx,{
    type:'bar',
    data:{
      labels:['Receitas','Dívidas','Gastos','Saldo'],
      datasets:[{
        data:[totRec,totDiv,totGas,Math.max(0,saldo)],
        backgroundColor:['#00d97e22','#ff4d6d22','#b47cff22','#4d9fff22'],
        borderColor:['#00d97e','#ff4d6d','#b47cff','#4d9fff'],
        borderWidth:1.5,borderRadius:8
      }]
    },
    options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#1e2a3815'},ticks:{color:'#4a5e72',font:{family:'Outfit',size:10}}},y:{grid:{color:'#1e2a3815'},ticks:{color:'#4a5e72',font:{family:'Outfit',size:10},callback:v=>'R$'+v}}}}
  });

  // GASTOS
  renderCategorias();
  const gastosOrdenados=[...gastos].sort((a,b)=>new Date(b.data)-new Date(a.data));
  document.getElementById('gas-sub').textContent=`${gastos.length} gasto(s) · ${fmt(totGas)} este mês`;
  document.getElementById('gas-total').textContent=fmt(totGas);
  let hg='';
  if(gastosOrdenados.length){
    gastosOrdenados.forEach(g=>{
      hg+=`<div class="item">
        <div style="font-size:1.2rem;flex-shrink:0">${g.emoji}</div>
        <div class="item-info">
          <div class="item-name">${g.nome}</div>
          <div class="item-meta">${fmtDt(g.data)}</div>
        </div>
        <div class="item-vals"><div class="item-val" style="color:var(--purple)">${fmt(g.valor)}</div></div>
        <div class="item-actions">
          <button class="icon-btn del" onclick="removerGasto(${g.id})">✕</button>
        </div>
      </div>`;
    });
  } else hg=`<div class="empty"><div class="empty-icon">🛒</div><p>Nenhum gasto anotado ainda este mês</p></div>`;
  document.getElementById('gastos-lista').innerHTML=hg;

  // DÍVIDAS
  const grupos=[...new Set(dividas.map(d=>d.grupo))];
  let hd='';
  grupos.forEach(g=>{
    const gi=dividas.filter(d=>d.grupo===g);
    const gt=gi.filter(d=>!d.pago).reduce((s,d)=>s+d.valor,0);
    hd+=`<div class="section-header"><div class="section-title">${g}</div><div class="section-right">${fmt(gt)}</div></div>`;
    gi.forEach(d=>{
      hd+=`<div class="item ${d.pago?'pago':''} ${vencendo(d.dia)?'vencendo':''}">
        <div class="dot ${corGrupo(d.grupo)}"></div>
        <div class="item-info">
          <div class="item-name">${d.nome}${d.dia?` <span style="font-size:.62rem;color:var(--yellow)">dia ${d.dia}</span>`:''}</div>
          <div class="item-meta">${d.parcelas>1?`${d.restantes}x de ${fmt(d.valor)} = ${fmt(d.valor*d.restantes)}`:'mensal / única'}</div>
        </div>
        <div class="item-vals">
          <div class="item-val">${fmt(d.valor)}</div>
          ${d.parcelas>1?`<div class="item-val-sub">total ${fmt(d.valor*d.restantes)}</div>`:''}
        </div>
        <div class="item-actions">
          <button class="icon-btn pay" onclick="pagarParcela(${d.id})">✓</button>
          <button class="icon-btn del" onclick="removerDivida(${d.id})">✕</button>
        </div>
      </div>`;
    });
  });
  if(!dividas.length)hd=`<div class="empty"><div class="empty-icon">🎉</div><p>Sem dívidas!</p></div>`;
  document.getElementById('dividas-lista').innerHTML=hd;
  document.getElementById('div-sub').textContent=`${dividas.filter(d=>!d.pago).length} pendente(s) · ${fmt(totDiv)}`;

  // RECEITAS
  let hr='';
  if(receitas.length){
    receitas.forEach(r=>{
      hr+=`<div class="item"><div class="dot green"></div><div class="item-info"><div class="item-name">${r.nome}</div><div class="item-meta">${r.tipo}${r.dia?` · dia ${r.dia}`:''}</div></div><div class="item-vals"><div class="item-val" style="color:var(--green)">${fmt(r.valor)}</div></div><div class="item-actions"><button class="icon-btn del" onclick="removerReceita(${r.id})">✕</button></div></div>`;
    });
  } else hr=`<div class="empty"><div class="empty-icon">💵</div><p>Adicione suas receitas para calcular o saldo</p></div>`;
  document.getElementById('receitas-lista').innerHTML=hr;
  document.getElementById('rec-sub').textContent=`${receitas.length} receita(s) · ${fmt(totRec)}`;

  // HISTÓRICO
  const icons={pago:'✅',adicionado:'➕',receita:'💵',removido:'🗑',gasto:'🛒',reset:'🔄'};
  let hh='';
  if(historico.length){
    historico.forEach(h=>{
      hh+=`<div class="hist-item"><div class="hist-icon">${h.tipo==='gasto'?(estado.gastos.find(g=>g.nome===h.nome.replace(/^.+ /,''))?.emoji||'🛒'):icons[h.tipo]||'•'}</div><div class="hist-info"><div class="hist-nome">${h.nome}</div><div class="hist-data">${fmtDt(h.data)}</div></div>${h.valor>0?`<div class="hist-val" style="color:${h.tipo==='receita'?'var(--green)':h.tipo==='pago'?'var(--yellow)':h.tipo==='gasto'?'var(--purple)':'var(--muted)'}">${fmt(h.valor)}</div>`:''}</div>`;
    });
  } else hh=`<div class="empty"><div class="empty-icon">📋</div><p>Nenhuma ação registrada ainda</p></div>`;
  document.getElementById('hist-lista').innerHTML=hh;
}

// ── NOTIF ─────────────────────────────────────────────────────────────────────
let nt;
window.notif = function(msg) {
  const el=document.getElementById('notif');
  el.textContent=msg; el.style.display='block';
  clearTimeout(nt); nt=setTimeout(()=>el.style.display='none',2800);
};

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  document.getElementById('data-hoje').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});

  const snap = await getDoc(REF);
  if(!snap.exists()) {
    await setDoc(REF, INICIAIS);
  }

  onSnapshot(REF, snap => {
    if(snap.exists()) {
      estado = snap.data();
      if(!estado.gastos) estado.gastos=[];
      verificarResetMensal();
      renderizar();
      setSyncDot('ok');
      document.getElementById('loading').style.display='none';
    }
  });
}

init();
</script>
</body>
</html>
